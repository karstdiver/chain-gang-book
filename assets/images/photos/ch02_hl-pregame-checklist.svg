<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      .bg{fill:#f4f6f8}
      .frame{fill:none;stroke:#2d3e50;stroke-width:6}
      .title{font:700 42px 'Arial', sans-serif; fill:#2d3e50}
      .subtitle{font:400 24px 'Arial', sans-serif; fill:#425466}
      .label{font:400 20px 'Arial', sans-serif; fill:#333}
      .note{font:400 18px 'Arial', sans-serif; fill:#666}
      .photo{fill:#cbd5e1}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="800"/>
  <rect class="frame" x="40" y="40" width="1120" height="720" rx="8" ry="8"/>
  <text class="title" x="60" y="100">Head Linesman – Pre‑Game Checklist (Placeholder)</text>
  <text class="subtitle" x="60" y="140">Replace this SVG with the real photo file before publishing</text>
  <rect class="photo" x="60" y="180" width="760" height="540" rx="8"/>
  <text class="label" x="80" y="220">[Photo area]</text>
  <g>
    <circle cx="900" cy="260" r="10" fill="#3498db"/>
    <text class="label" x="920" y="268">Insert actual JPEG at assets/images/photos/ch02_hl-pregame-checklist.jpg</text>
    <circle cx="900" cy="320" r="10" fill="#3498db"/>
    <text class="label" x="920" y="328">Keep filename stable for figure reference</text>
    <circle cx="900" cy="380" r="10" fill="#3498db"/>
    <text class="label" x="920" y="388">Alt: Head linesman pre‑game briefing checklist on clipboard</text>
    <circle cx="900" cy="440" r="10" fill="#3498db"/>
    <text class="label" x="920" y="448">Caption: On‑field pre‑game briefing checklist</text>
  </g>
  <text class="note" x="60" y="760">This is a temporary, vector placeholder for layout/testing only.</text>
</svg>






