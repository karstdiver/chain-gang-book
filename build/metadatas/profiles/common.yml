---
# =============================================================================
# Chain Gang Book — build metadata (Pandoc + Makefile)
# =============================================================================
# Used by:  pandoc --metadata-file=build/metadata.yml
# Makefile: METADATA, PROFILE, PUBLISHER (future overlays)
# Do not edit build/book.md — that file is stitched from the manifest.

# --- Pandoc document metadata (pdf/epub/docx; book.tex.tpl reads these) ---
# `author` is Pandoc's standard field: EPUB OPF, DOCX core properties,
# \author in book.tex.tpl, and {{author}} in manuscript/frontmatter/title-page.md
# (the Lua filter in assets/styles/boxes.lua performs that substitution).
# Printed signatures use {{author-initials}}.
# Printed edition line on the title page uses {{edition}} (Lua filter).
title: Friday Night Chains
subtitle: A Practical Guide for High School Football Chain Crews
author:
  - Richard Kallay
# Displayed via {{author-initials}} in preface and acknowledgements.
author-initials: RRK
# Reader-facing edition (not a git tag). Bump when you mean a new edition.
edition: First Kindle edition, August 2026
lang: en-US
date: 2026-05-26
rights: "© 2026 Richard Kallay. All rights reserved."

# --- Structure (today duplicated on pandoc CLI as --toc --number-sections) ---
toc: true
number-sections: true
toc-depth: 3

# Suppress Pandoc's auto EPUB title page; we use manuscript/frontmatter/title-page.md
epub-title-page: false

# --- Discovery / EPUB OPF (optional but useful) ---
description: |
  A practical guide to high school football chain crews — roles,
  responsibilities, equipment, safety, and professionalism on Friday night.
keywords:
  - chain gang
  - football officiating
  - sideline crew
  - high school football

# --- Makefile / export filenames (custom key — Pandoc ignores unless you use it) ---
# Future: TITLE := $(shell yq -r '.slug' $(METADATA))
slug: chain-gang-book

# --- Build context (sidecar — for you, validate, docs; not used by Pandoc today) ---
profile: fullbook          # mirrors make PROFILE=fullbook
publisher: common          # mirrors make PUBLISHER=common

# --- Assets (paths relative to repo root) ---
# Cover files are chosen by the Makefile per target, not by this single key:
#   make draft → DEFAULT_COVER_IMAGE (assets/covers/default-cover-image.jpg)
#   make pdf   → PDF_COVER_IMAGE     (assets/covers/pdf-cover-image.jpg)
#   make epub  → EPUB_COVER_IMAGE    (assets/covers/epub-cover-image.jpg)
#   make docx  → no cover slot
# Override: make pdf PDF_COVER_IMAGE=assets/covers/some-other.jpg
# cover-image: (unused by make; passed per-target via --metadata / --epub-cover-image)

# --- Identifier (optional; KDP EPUB often uses ASIN only) ---
# identifier:
#   - scheme: ISBN-13
#     text: "978-0-000000-00-0"
---
